name: daily-email
# 다음날 아침(한국시간 08:00) 전날 리포트를 메일로 발송
on:
  schedule:
    - cron: "0 23 * * *"    # 23:00 UTC = 08:00 KST (다음날)
  workflow_dispatch:
    inputs:
      tag:
        description: "제목 뒤에 붙일 태그(스레드 분리/테스트용)"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send report email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          SUBJECT_TAG: ${{ inputs.tag }}
          # 발신 분리용(비우면 config.json 폴백 = 기존 Gmail). 전용 계정/ESP 사용 시 채움.
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: python3 scripts/send_email.py
